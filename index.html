<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pause &amp; Solve</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --blue: #0cc0df; --red: #e00000; --soft: #f2f2f2; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: #000; font-family: "Open Sans", Arial, sans-serif; font-size: 18px; line-height: 1.6; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left)); }
  .narrow { max-width: 760px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
  .top a { font-weight: 800; text-decoration: none; font-size: 20px; }
  h1 { font-size: clamp(34px, 6vw, 68px); font-weight: 800; line-height: 1.1; margin: 0 0 10px; text-align: center; overflow-wrap: anywhere; }
  .sub { text-align: center; margin: 0 0 28px; }
  button { font: inherit; font-weight: 800; background: #fff; color: #000; border: 3px solid #000; padding: 10px 18px; cursor: pointer; min-height: 48px; }
  button:hover { background: #000; color: #fff; }
  button.blue { background: var(--blue); }
  button.blue:hover { background: #000; }
  button.on { background: #000; color: #fff; }
  button.small { padding: 4px 12px; min-height: 36px; font-size: 15px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  input, textarea { font: inherit; font-size: 17px; border: 3px solid #000; padding: 10px; width: 100%; background: #fff; color: #000; border-radius: 0; }
  textarea { resize: vertical; }
  label { font-weight: 800; display: block; margin: 16px 0 6px; }
  .note { font-size: 15px; }
  .err { color: var(--red); font-weight: 600; }
  .hide { display: none !important; }

  /* home */
  .make { border: 3px solid #000; padding: 20px; }
  .make .go { margin-top: 16px; width: 100%; font-size: 20px; }
  .status p { margin: 8px 0 0; font-weight: 600; overflow-wrap: anywhere; }
  h2.mine { font-size: 28px; font-weight: 800; margin: 44px 0 8px; }
  .lib .item { display: flex; align-items: center; gap: 12px; border-top: 3px solid #000; padding: 16px 0; }
  .lib .item:last-child { border-bottom: 3px solid #000; }
  .lib a { flex: 1; text-decoration: none; min-width: 0; }
  .lib a:hover .t { text-decoration: underline; }
  .lib .t { font-size: 22px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
  .lib .m { font-size: 15px; }

  input[type=checkbox] { width: 24px; height: 24px; flex: none; padding: 0; margin: 2px 0 0; accent-color: #000; }
  .picker, .queue { border-top: 3px solid #000; margin-top: 16px; padding-top: 14px; }
  .picklist { max-height: 46vh; overflow-y: auto; border: 3px solid #000; padding: 4px 12px; }
  .pick { display: flex; gap: 12px; align-items: flex-start; font-weight: 600; margin: 10px 0; cursor: pointer; overflow-wrap: anywhere; }
  .qrow { margin: 6px 0; font-size: 16px; overflow-wrap: anywhere; }

  /* lesson */
  .modes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
  .sec { border-top: 3px solid #000; padding: 24px 0; display: grid; gap: 20px 40px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 920px) { .sec { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
  .time { font-size: 15px; font-weight: 600; }
  .sec h2 { font-size: 28px; font-weight: 800; margin: 2px 0 10px; line-height: 1.2; }
  .sec p { margin: 0 0 14px; }
  .said { margin-top: 6px; }
  .said summary, .solved summary { cursor: pointer; font-weight: 800; padding: 6px 0; }
  .said blockquote { margin: 8px 0 0; padding: 4px 0 4px 14px; border-left: 6px solid var(--blue); }
  .side h3 { font-size: 15px; font-weight: 800; letter-spacing: 1px; margin: 0 0 6px; }
  .side ul { margin: 0 0 18px; padding-left: 20px; }
  .side li { margin: 6px 0; }

  .q { background: var(--blue); padding: 24px; margin: 8px 0 32px; }
  .q .tag { font-weight: 800; font-size: 15px; letter-spacing: 1px; }
  .q h2 { font-size: 30px; font-weight: 800; margin: 2px 0 12px; line-height: 1.2; }
  .q img { display: block; width: 100%; max-width: 860px; height: auto; border: 3px solid #000; background: #fff; }
  .q .text { font-size: 20px; font-weight: 600; margin: 14px 0; }
  .board { background: #fff; border: 3px solid #000; padding: 12px 16px; margin: 12px 0; }
  .board b { display: block; font-size: 15px; letter-spacing: 1px; }
  .parts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); align-items: start; }
  .part { background: #fff; border: 3px solid #000; padding: 16px; min-width: 0; }
  .part .prompt { font-weight: 800; font-size: 20px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { border-left: 6px solid var(--blue); padding: 4px 0 4px 12px; margin: 12px 0 0; }
  .work { margin-top: 14px; border-top: 3px solid #000; padding-top: 12px; }
  .work ol { margin: 0 0 12px; padding-left: 24px; }
  .work li { margin: 6px 0; }
  .answer { font-weight: 800; font-size: 22px; overflow-wrap: anywhere; }
  .solved { margin-top: 12px; }
  .shot { display: block; width: 100%; height: auto; border: 3px solid #000; margin: 4px 0 16px; }
  .board, .sec p, .q .text { white-space: pre-line; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: -12px 0 24px; align-items: center; }
  .pair { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 12px; align-items: start; }
  @media (min-width: 820px) { .pair { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
  .pair .board, .solved .board { margin: 0; }
  .solved > div { margin-top: 12px; }
  .board ol, .board ul { margin: 4px 0 0; padding-left: 22px; }
  .board p { margin: 4px 0; }
  .practice { border-top: 3px solid #000; margin-top: 14px; padding-top: 12px; }
  .practice b { font-size: 15px; letter-spacing: 1px; }
  .score { margin-top: 12px; }
  .score .got { color: #006b29; font-weight: 800; }
  .score .miss { color: var(--red); font-weight: 800; }
  @media (max-width: 600px) {
    body { font-size: 17px; }
    .q { padding: 16px; margin-left: -16px; margin-right: -16px; }
    .q h2 { font-size: 24px; } .sec h2 { font-size: 24px; }
  }

  #app img { cursor: zoom-in; }
  #viewer { position: fixed; inset: 0; z-index: 50; background: #000; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
  #viewer img { margin: auto; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
  #viewer.zoom img { max-width: none; max-height: none; width: 250vw; cursor: zoom-out; }
  #viewer .vclose { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 2; }
  #viewer .vhelp { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; color: #fff; font-size: 14px; pointer-events: none; text-shadow: 0 0 4px #000; }
  #viewer.zoom .vhelp { display: none; }

  /* AI side panel + settings */
  #aiBtn { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5; }
  #ai { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; border-left: 3px solid #000; display: flex; flex-direction: column; z-index: 10; }
  #ai header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 3px solid #000; font-weight: 800; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; font-size: 16px; }
  .msg { margin: 0 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { font-weight: 800; }
  #ai form { display: flex; gap: 8px; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 3px solid #000; }
  #ai textarea { flex: 1; min-width: 0; resize: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="#">Pause &amp; Solve</a><span id="progress"></span></div>
  <main id="app"></main>
</div>

<button id="aiBtn" class="blue">Ask AI</button>
<aside id="ai" class="hide" aria-label="Ask AI">
  <header><span>Ask AI</span><button id="aiClose" class="small">Close</button></header>
  <div id="msgs"></div>
  <form id="askForm"><textarea id="ask" rows="2" placeholder="Stuck? Ask about this lesson."></textarea><button class="blue">Send</button></form>
</aside>

<script>
// Everything lives in this browser only (localStorage). Nothing is uploaded anywhere
// except the video link and your questions, which go straight to Google's Gemini with your own key.
const $ = (s, n = document) => n.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
};
const stamp = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const secs = v => {            // accepts 95, "95", "1:35", "0:01:35"
  if (typeof v === 'number') return v;
  const p = String(v || '0').split(':').map(Number);
  return p.reduce((a, b) => a * 60 + (b || 0), 0);
};
const P = 'ps:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(P + k); } catch {} },
};
const DEFAULT_MODEL = 'gemini-3.5-flash';
const FALLBACKS = ['gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-flash-lite-latest'];
const model = () => store.get('model', DEFAULT_MODEL) || DEFAULT_MODEL;
let current = null;

// ---------- Gemini
async function geminiOnce(m, key, body, onTick) {
  const ctl = new AbortController();
  let timer = setTimeout(() => ctl.abort(), 90000);            // nothing for 90 seconds = move on
  const alive = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), 90000); };
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`, {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body), signal: ctl.signal,
    });
    if (!res.ok) {
      let j = await res.json().catch(() => ({}));
      if (Array.isArray(j)) j = j[0] || {};
      const e = new Error(j.error?.message || `Request failed (${res.status})`);
      e.fatal = res.status === 401 || res.status === 403 || /api key/i.test(e.message);
      throw e;
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      alive();
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        let j; try { j = JSON.parse(line.slice(5)); } catch { continue; }
        if (j.error) throw new Error(j.error.message);
        for (const p of j.candidates?.[0]?.content?.parts || []) if (p.text && !p.thought) text += p.text;
        onTick(text.length);
      }
    }
    return text;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The AI took too long to answer.');
    throw e;
  } finally { clearTimeout(timer); }
}

async function gemini(body, onTick = () => {}) {
  const key = store.get('key', '');
  if (!key) throw new Error('Add your free Gemini key first.');
  let last = new Error('The AI sent back nothing. Try again.');
  // Google's free AI is often busy. Try every model, and if all are busy wait a bit and go round again.
  for (const wait of [0, 10, 25, 45]) {
    if (wait) { onTick(0, `The AI is busy. Trying again in ${wait} seconds...`); await new Promise(r => setTimeout(r, wait * 1000)); onTick(0, 'Trying again...'); }
    for (const m of [...new Set([model(), ...FALLBACKS])]) {
      try { const text = await geminiOnce(m, key, body, onTick); if (text) return text; }
      catch (e) { last = e; if (e.fatal) throw e; }
    }
  }
  throw new Error("Google's AI is too busy right now (" + last.message + ') Try again in a few minutes.');
}

// ---------- pictures: kept in this browser's own database (IndexedDB), keyed by second of the video
let pics = {};
const idb = () => new Promise((ok, bad) => {
  const r = indexedDB.open('pause-solve', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('pics');
  r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
});
const idbDo = async (mode, fn, fallback) => {
  try {
    const db = await idb();
    return await new Promise(ok => { const r = fn(db.transaction('pics', mode).objectStore('pics')); r.onsuccess = () => ok(r.result); r.onerror = () => ok(fallback); });
  } catch { return fallback; }
};
const picsGet = async id => (await idbDo('readonly', st => st.get(id), null)) || {};
const picsSet = (id, map) => idbDo('readwrite', st => st.put(map, id), null);
const picsDel = id => idbDo('readwrite', st => st.delete(id), null);
const cleanPics = map => Object.fromEntries(Object.entries(map && typeof map === 'object' ? map : {}).filter(([t, src]) => /^\d+$/.test(t) && img(src)));
const picTimes = v => [...new Set([
  ...v.sections.map(s => s.showAt),
  ...v.questions.flatMap(q => [q.frameAt, q.solvedAt, ...q.work.map(w => w.at)]),
].filter(t => Number.isInteger(t) && t >= 0))];

// ---------- your own devices: lessons are locked in the browser with your sync code before they go online
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const sha256 = str => crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
const me = () => store.get('me', null);                 // { name, secret } once signed in on this device
const syncCode = () => (me() || {}).secret || '';
const cleanName = str => String(str).replace(/[^A-Za-z0-9 _-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20);
const pinProblem = pin => {
  if (!/^\d{4}$/.test(pin)) return 'The PIN is 4 digits.';
  const d = [...pin].map(Number);
  const step = d[1] - d[0];
  if (new Set(d).size === 1) return 'Too easy: all the same digit.';
  if (Math.abs(step) === 1 && d[2] - d[1] === step && d[3] - d[2] === step) return 'Too easy: digits in a row.';
  if (d[0] === d[2] && d[1] === d[3]) return 'Too easy: a repeated pair.';
  if (d[0] === d[1] && d[2] === d[3]) return 'Too easy: two doubles.';
  if (d[0] === d[3] && d[1] === d[2]) return 'Too easy: it reads the same backwards.';
  if (+pin >= 1950 && +pin <= 2030) return 'Too easy: it looks like a year.';
  if (['1004', '2580', '0852', '1379', '2468', '1357', '0246', '1470', '3690'].includes(pin)) return 'Too easy: a very common PIN.';
  return '';
};
async function secretFor(name, pin) {    // slow on purpose, so guessing PINs takes longer
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(name.toLowerCase() + '|' + pin), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('pause-solve-v1'), iterations: 400000 }, base, 256));
}
const getUsers = async () => { try { const j = await (await fetch('v/users.json?t=' + Date.now(), { cache: 'no-store' })).json(); return Array.isArray(j) ? j.map(cleanName).filter(Boolean) : []; } catch { return []; } };
const helperUp = async () => { try { return (await fetch('http://localhost:4174/ping')).ok; } catch { return false; } };
async function syncKeys(code) {
  const raw = code.replace(/-/g, '');
  return {
    key: await crypto.subtle.importKey('raw', await sha256(raw + '|key'), 'AES-GCM', false, ['encrypt', 'decrypt']),
    name: async what => hex(await sha256(raw + '|' + what)).slice(0, 32) + '.bin',
  };
}
async function seal(k, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k.key, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  let bin = ''; for (let i = 0; i < out.length; i += 0x8000) bin += String.fromCharCode(...out.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function cloudGet(k, what) {
  try {
    const r = await fetch(`v/${await k.name(what)}?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return null;
    const b = new Uint8Array(await r.arrayBuffer());
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, k.key, b.slice(12))));
  } catch { return null; }
}
async function cloudPut(k, what, obj) {     // only works on the PC that runs the picture helper
  const r = await fetch('http://localhost:4174/publish', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name: await k.name(what), data: await seal(k, obj) }) });
  if (!r.ok) throw new Error('upload failed');
}
const libRow = v => ({ id: v.id, title: v.title });
async function syncUp(v) {
  const k = await syncKeys(syncCode());
  await cloudPut(k, 'lesson:' + v.id, { ...v, frames: await picsGet(v.id) });
  const idx = [...(await cloudGet(k, 'index') || []), ...store.get('syncIdx', [])].filter((x, i, a) => x && x.id !== v.id && a.findIndex(y => y.id === x.id) === i);
  idx.push(libRow(v));
  await cloudPut(k, 'index', idx);
  store.set('syncIdx', idx);
}
async function syncAll(say = () => {}) {
  const code = syncCode();
  if (!code) return { down: 0, up: 0 };
  const k = await syncKeys(code);
  const cloud = await cloudGet(k, 'index');
  const idx = [...(cloud || []), ...store.get('syncIdx', [])].filter((x, i, a) => x && a.findIndex(y => y.id === x.id) === i);
  let down = 0, up = 0;
  for (const row of idx) {                                   // bring down what this device does not have
    if (store.get('v:' + row.id, null) || store.get('gone', []).includes(row.id)) continue;
    say(`Getting "${row.title}"...`);
    const j = await cloudGet(k, 'lesson:' + row.id);
    if (!j) continue;
    saveLesson(row.id, j); await picsSet(row.id, cleanPics(j.frames)); down++;
  }
  for (const row of store.get('lib', [])) {                 // send up what is only here (PC with the helper only)
    if (idx.some(x => x.id === row.id)) continue;
    const v = store.get('v:' + row.id, null); if (!v) continue;
    say(`Sending "${row.title}"...`);
    try { await syncUp(v); up++; } catch { break; }
  }
  return { down, up };
}
function syncBox(redraw) {
  const box = el('div', { class: 'make', style: 'margin-top:12px' });
  const msg = el('p', { class: 'note', 'aria-live': 'polite', style: 'margin:10px 0 0' });
  const say = (t, bad) => { msg.className = 'note' + (bad ? ' err' : ''); msg.textContent = t; };
  const go = async () => {
    say('Syncing...');
    try {
      const r = await syncAll(t => say(t));
      say((r.down || r.up) ? `Done. ${r.down} lesson(s) brought here, ${r.up} sent.` : 'Everything is up to date.');
      if (r.down) redraw();
    } catch (e) { say("Couldn't sync: " + e.message, true); }
  };
  const pinInput = () => el('input', { type: 'password', inputmode: 'numeric', maxlength: '4', pattern: '[0-9]*', placeholder: '4 digit PIN', autocomplete: 'off', 'aria-label': '4 digit PIN', style: 'max-width:200px' });

  const signedIn = () => box.replaceChildren(
    el('b', {}, 'Signed in as'), el('p', { style: 'font-size:24px;font-weight:800;margin:4px 0;overflow-wrap:anywhere' }, me().name),
    el('p', { class: 'note' }, 'Your lessons follow you. On another device, open this site, pick your name and type your PIN.'),
    el('div', { class: 'row' }, el('button', { class: 'blue small', onclick: go }, 'Sync now'),
      el('button', { class: 'small', onclick: () => { if (confirm('Sign out on this device? Your lessons stay on this device.')) { store.del('me'); store.del('syncIdx'); draw(); } } }, 'Sign out')),
    msg);

  const signIn = name => {
    const pin = pinInput();
    const btn = el('button', { class: 'blue small' }, 'Sign in');
    btn.onclick = async () => {
      if (!/^\d{4}$/.test(pin.value)) return say('The PIN is 4 digits.', true);
      btn.disabled = true; say('Checking...');
      const secret = await secretFor(name, pin.value);
      const found = await cloudGet(await syncKeys(secret), 'index');
      btn.disabled = false;
      if (!found) { pin.value = ''; return say('Wrong PIN. Try again.', true); }
      store.del('syncIdx'); store.set('me', { name, secret }); draw(); go();
    };
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    box.replaceChildren(el('b', {}, 'Hi ' + name), el('label', {}, 'Your PIN'), pin,
      el('div', { class: 'row', style: 'margin-top:10px' }, btn, el('button', { class: 'small', onclick: draw }, 'Back')), msg);
    say(''); pin.focus();
  };

  const signUp = users => {
    const name = el('input', { type: 'text', maxlength: '20', placeholder: 'Username', autocomplete: 'off', 'aria-label': 'Username' });
    const pin = pinInput();
    const btn = el('button', { class: 'blue small' }, 'Create my account');
    btn.onclick = async () => {
      const n = cleanName(name.value);
      if (n.length < 2) return say('Pick a username with at least 2 letters or numbers.', true);

async function picServers() {
  const list = [];
  const own = store.get('picServer', ''); if (own) list.push(own);
  try { const j = await (await fetch('pictures.json', { cache: 'no-store' })).json(); if (j.url) list.push(j.url); } catch {}
  list.push('http://localhost:4174');
  return [...new Set(list.map(u => String(u).replace(/\/+$/, '')))];
}
async function fetchPictures(v, onTick = () => {}) {
  const times = picTimes(v);
  if (!times.length) return 0;
  for (const base of await picServers()) {
    try {
      const have = {};
      for (let i = 0; i < times.length; i += 8) {
        const r = await fetch(`${base}/frames?id=${v.id}&t=${times.slice(i, i + 8).join(',')}`);
        if (!r.ok) throw new Error('server said ' + r.status);
        Object.assign(have, cleanPics((await r.json()).frames));
        onTick(Object.keys(have).length, times.length);
      }
      if (Object.keys(have).length) { await picsSet(v.id, have); return Object.keys(have).length; }
    } catch {}
  }
  return 0;
}

const LESSON_PROMPT = extra => `Watch this whole lesson video carefully (picture and sound) and turn it into a study lesson
for a student who is learning this topic for the very first time.

Return JSON only, in exactly this shape:
{
  "title": "<the lesson's topic as a short title>",
  "channel": "<the presenter's name if they say or show it, else empty>",
  "duration": "<video length as MM:SS>",
  "sections": [ {
      "start": "MM:SS", "end": "MM:SS",
      "title": "<short title>",
      "showAt": "MM:SS",
      "explain": ["<paragraph>", "<paragraph>", ...],
      "keyFacts": ["<fact, formula or rule worth memorising>", ...],
      "presenterSaid": "<what the presenter actually said in this part, cleaned up>"
  } ],
  "questions": [ {
      "start": "MM:SS", "end": "MM:SS",
      "title": "<short name>",
      "question": "<the full problem with every number and unit needed to solve it>",
      "frameAt": "MM:SS",
      "board": "<what is drawn or written on screen for this problem BEFORE it is solved, described so the student can sketch it. Empty if nothing.>",
      "parts": [ { "label": "a", "prompt": "<what to find>", "hints": ["<gentle nudge>", "<stronger nudge>"],
                   "steps": ["<step 1>", "<step 2>", ...], "answer": "<final answer with units>" } ],
      "work": [ { "at": "MM:SS", "note": "<1 or 2 sentences: what the presenter has just drawn or written at this moment, and why>" } ],
      "solvedAt": "MM:SS",
      "finishedBoard": "<what the presenter's screen shows once the problem is fully solved, described in words>"
  } ]
}

Screenshot moments (a screenshot of the video is taken at each one, so pick them with care):
- section "showAt": the moment in that part when the screen shows the most useful thing for the explanation
  (the finished diagram, formula, table or slide for that part). It must be inside the section.
- question "frameAt": a moment when the whole problem is visible on screen and the presenter has NOT started writing the solution.
- question "work": 1 to 3 moments while the presenter is solving it, spread out, each showing new working on screen.
- question "solvedAt": the moment the finished solution is fully on screen, just before the presenter moves on.

Rules for sections:
- Cover the whole video in order. No section is longer than 2 minutes. A 15 minute video has at least 8 sections.
- "explain" is real teaching, not bullet points. 2 to 4 short paragraphs, no lists inside. Explain it the way the
  presenter does, in the same order, with the same examples and reasons, and make it clearer where you can.
  Write like a friendly older student talking to a 14 year old, not like a textbook. Use words a 12 year old
  knows, plus the subject's own terms. Sentences under 20 words. Talk to the student as "you".
  Bad: "Scalar values can be added directly, avoiding the need to decompose quantities into coordinate axes."
  Good: "A scalar is just a number, like 5 or -3. It has no direction. So you can add scalars the normal way, which is much easier than adding arrows."
  One idea per paragraph. Say WHY, not just what.
  Define every new word the first time it appears. Assume the student has never seen this before.
- "keyFacts": 1 to 4 short lines, only the things worth memorising (formulas, rules, definitions, common mistakes).
- "presenterSaid": the presenter's own words for that part, faithful to what was said, with filler removed
  ("um", "okay", repeats, false starts). Keep every important fact. Do not invent anything.

Rules for questions:
- Include every example or practice problem the presenter poses and works through, even quick ones.
- Sub-questions (a, b, c) become parts of one question. When a problem asks about several forces, objects or
  moments, make one part for each, so the student answers them one at a time. A single question uses one part with label "".
- Hints never give the answer away. Steps follow the presenter's own working, one move per step, each explained
  for a beginner. If the presenter never computes the final number, compute it yourself and check it twice.

Write maths in plain text, for example: W = F cos(40°) × Δx. No LaTeX, no markdown.
${extra ? '\nThe student also asked for this: ' + extra : ''}`;

async function buildLesson(id, extra, onTick) {
  const text = await gemini({
    contents: [{ role: 'user', parts: [
      { fileData: { fileUri: `https://www.youtube.com/watch?v=${id}` } },
      { text: LESSON_PROMPT(extra) },
    ] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.2, mediaResolution: 'MEDIA_RESOLUTION_LOW', maxOutputTokens: 65536 },
  }, onTick);
  let j;
  try { j = JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, '')); }
  catch { throw new Error('The AI answer got cut off. This video may be too long. Try a shorter one.'); }
  return saveLesson(id, j);
}

const img = s => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(s || '')) ? String(s) : '';
function saveLesson(id, j) {
  const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
  const v = {
    id, url: `https://www.youtube.com/watch?v=${id}`,
    title: String(j.title || 'Untitled lesson'), channel: String(j.channel || ''), duration: secs(j.duration),
    sections: arr(j.sections).map(s => ({
      start: secs(s.start), end: secs(s.end), title: String(s.title || ''), showAt: s.showAt == null ? null : secs(s.showAt),
      explain: arr(s.explain).map(String), keyFacts: arr(s.keyFacts).map(String), presenterSaid: String(s.presenterSaid || ''),
    })),
    questions: arr(j.questions).map((q, i) => ({
      id: 'q' + (i + 1), start: secs(q.start), end: secs(q.end), title: String(q.title || 'Question ' + (i + 1)),
      question: String(q.question || ''), board: String(q.board || ''), finishedBoard: String(q.finishedBoard || ''),
      frameAt: secs(q.frameAt ?? q.start), solvedAt: secs(q.solvedAt ?? q.end),
      work: arr(q.work).map(w => ({ at: secs(w.at), note: String(w.note || '') })),
      parts: arr(q.parts).map(p => ({
        label: String(p.label || ''), prompt: String(p.prompt || ''), hints: arr(p.hints).map(String),
        steps: arr(p.steps).map(String), answer: String(p.answer || ''),
      })),
    })),
  };
  if (!v.sections.length && !v.questions.length) throw new Error('The AI could not read this video. Check that it is public.');
  store.set('gone', store.get('gone', []).filter(x => x !== id));
  if (!store.set('v:' + id, v)) throw new Error('This browser is out of storage. Delete an old lesson and try again.');
  const lib = store.get('lib', []).filter(x => x.id !== id);
  lib.unshift({ id, title: v.title, channel: v.channel, duration: v.duration, questions: v.questions.length, parts: v.questions.reduce((n, q) => n + q.parts.length, 0) });
  store.set('lib', lib);
  return v;
}

async function similarProblem(q, p) {
  const text = await gemini({

with a different situation and different numbers, at the same difficulty. The student is a beginner.
Original problem: ${q.question}
Asked: ${p.prompt}
Original working: ${p.steps.join(' ')}
Original answer: ${p.answer}
Return JSON only: {"question": "<full new problem with all numbers and units>", "hints": ["<gentle nudge>", "<stronger nudge>"],
"steps": ["<step, explained for a beginner>", ...], "answer": "<final answer with units>"}
Check your own arithmetic twice. Plain text maths, no LaTeX, no markdown.` }] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.8 },
  });
  const j = JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, ''));

// ---------- build queue: videos are built one at a time, in the background, while this tab stays open
const queue = () => store.get('queue', []);
let queueDraw = () => {}, libDraw = () => {}, working = false;
const setItem = (id, patch) => { store.set('queue', queue().map(x => x.id === id ? { ...x, ...patch } : x)); queueDraw(); };
function addToQueue(items, extra) {
  const q = queue();
  for (const it of items) {
    const old = q.find(x => x.id === it.id);
    if (old) { if (old.state !== 'work') Object.assign(old, { state: 'wait', note: '', extra }); }
    else q.push({ id: it.id, title: it.title || '', state: 'wait', note: '', extra });
  }
  store.set('queue', q); queueDraw(); runQueue();
}
async function runQueue() {
  if (working) return;
  working = true;
  try {
    for (;;) {
      const it = queue().find(x => x.state === 'wait');
      if (!it || !store.get('key', '')) break;
      setItem(it.id, { state: 'work', note: 'The AI is watching it...' });
      try {
        let last = 0;
        const v = await buildLesson(it.id, it.extra || '', (n, note) => {
          if (!note && Date.now() - last < 1500) return;
          last = Date.now(); setItem(it.id, { note: note || `Writing the lesson... ${n.toLocaleString()} characters` });
        });
        setItem(it.id, { title: v.title, note: 'Getting the screenshots...' });
        const got = await fetchPictures(v, (a, b) => setItem(it.id, { note: `Screenshots ${a} of ${b}...` }));
        let note = got ? `${got} screenshots` : 'no screenshots (the picture helper is not reachable here)';
        if (syncCode()) {
          try { await syncUp(v); note += ', saved to your account'; }
          catch { note += ', not saved to your account (that only works on the home PC)'; }
        }
        setItem(it.id, { state: 'done', note });
        libDraw();
      } catch (e) {
        setItem(it.id, { state: 'fail', note: e.message });
        if (e.fatal) break;                                  // a bad key will fail every video, so stop
      }
    }
  } finally { working = false; queueDraw(); }
}

  const sims = el('div');
  const drawSims = () => sims.replaceChildren(...(store.get('similar:' + v.id, {})[key] || []).map((s, n) => practiceBlock(s, n + 1)));
  drawSims();
  const simMsg = el('p', { class: 'note' });
  const simBtn = el('button', { class: 'small blue' }, 'Give me a similar problem');
  simBtn.onclick = async () => {
    simBtn.disabled = true; simMsg.className = 'note'; simMsg.textContent = 'Writing a new one...';
    try {
      const s = await similarProblem(q, p);
      const all = store.get('similar:' + v.id, {}); (all[key] = all[key] || []).push(s); store.set('similar:' + v.id, all);
      simMsg.textContent = ''; drawSims();
    } catch (e) { simMsg.className = 'note err'; simMsg.textContent = "Couldn't make one: " + e.message; }
    simBtn.disabled = false;
  };
  let shown = 0;
  const hints = el('div');
  const hintBtn = el('button', { onclick: () => {
    hints.append(el('p', { class: 'hint' }, `Hint ${shown + 1}: ${p.hints[shown]}`));
    shown++;
    if (shown >= p.hints.length) hintBtn.classList.add('hide'); else hintBtn.textContent = 'Another hint';
  } }, 'Hint');
  if (!p.hints.length) hintBtn.classList.add('hide');

  const score = el('div', { class: 'score' });
  const drawScore = () => {
    const m = store.get('marks:' + v.id, {})[key];
    const mark = val => () => { const all = store.get('marks:' + v.id, {}); all[key] = val; store.set('marks:' + v.id, all); drawScore(); drawProgress(v); onMark(); };
    score.replaceChildren(
      m === 'got' ? el('span', { class: 'got' }, 'Got it. ') : m === 'miss' ? el('span', { class: 'miss' }, 'Missed it. Redo it later. ') : 'Did you get it? ',
      el('span', { class: 'row', style: 'display:inline-flex' },
        el('button', { class: 'small' + (m === 'got' ? ' on' : ''), onclick: mark('got') }, 'Got it'),
        el('button', { class: 'small' + (m === 'miss' ? ' on' : ''), onclick: mark('miss') }, 'Missed it')),
      m === 'miss' ? el('div', { style: 'margin-top:10px' }, simBtn, simMsg) : null);
  };
  drawScore();
  const work = el('div', { class: 'work hide' }, el('ol', {}, p.steps.map(s => el('li', {}, s))), el('div', { class: 'answer' }, 'Answer: ' + p.answer), score);
  const workBtn = el('button', { class: 'blue', onclick: () => {
    const hidden = work.classList.toggle('hide');
    workBtn.textContent = hidden ? 'Show working out' : 'Hide working out';
  } }, 'Show working out');
  return el('div', { class: 'part' },
    el('p', { class: 'prompt' }, (p.label ? `(${p.label}) ` : '') + (p.prompt || 'Solve it.')),
    el('div', { class: 'row' }, hintBtn, workBtn), hints, work, sims);
}

function questionBlock(v, q, n) {
  const box = el('section', { class: 'q', id: q.id },
    el('div', { class: 'tag' }, `QUESTION ${n} · ${stamp(q.start)} · `, el('a', { href: `${v.url}&t=${Math.floor(q.start)}s`, target: '_blank', rel: 'noopener' }, 'see it in the video')),
    el('h2', {}, q.title));
  if (pics[q.frameAt]) box.append(el('img', { src: pics[q.frameAt], alt: 'The question as shown in the video', loading: 'lazy' }));
  box.append(el('p', { class: 'text' }, q.question));
  if (q.board) box.append(el('div', { class: 'board' }, el('b', {}, 'ON THE BOARD'), q.board));
  box.append(el('div', { class: 'parts' }, q.parts.map((p, i) => partBlock(v, q, p, i))));
  const done = pics[q.solvedAt];
  const answers = el('div', { class: 'board' }, el('b', {}, 'FINISHED BOARD'),
    q.finishedBoard ? el('p', {}, q.finishedBoard) : null,
    el('ul', {}, q.parts.map(p => el('li', {}, (p.label ? `(${p.label}) ` : '') + p.answer))));
  box.append(el('details', { class: 'solved' },
    el('summary', {}, "Show the presenter's working and finished board (spoiler)"),
    (q.work || []).filter(w => pics[w.at] || w.note).map(w => el('div', { class: pics[w.at] ? 'pair' : '' },
      pics[w.at] ? el('img', { src: pics[w.at], alt: 'The presenter partway through the working', loading: 'lazy' }) : null,
      el('div', { class: 'board' }, el('b', {}, `PARTWAY THROUGH · ${stamp(w.at)}`), el('p', {}, w.note)))),
    el('div', { class: done ? 'pair' : '' },
      done ? el('img', { src: done, alt: "The presenter's finished board", loading: 'lazy' }) : null,
      answers)));
  return box;
}

function sectionBlock(v, s, i) {
  const notes = store.get('notes:' + v.id, {});
  const ta = el('textarea', { rows: '3', placeholder: 'Add your own notes here. They save by themselves.', 'aria-label': 'Your notes for ' + s.title });
  ta.value = notes[i] || '';
  ta.oninput = () => { const all = store.get('notes:' + v.id, {}); all[i] = ta.value; store.set('notes:' + v.id, all); };
  return el('section', { class: 'sec' },
    el('div', {},
      el('div', { class: 'time' }, `${stamp(s.start)} to ${stamp(s.end)}`),
      el('h2', {}, s.title),
      pics[s.showAt] ? el('img', { class: 'shot', src: pics[s.showAt], alt: 'The video at ' + stamp(s.showAt), loading: 'lazy' }) : null,
      s.explain.map(p => el('p', {}, p)),
      s.presenterSaid ? el('details', { class: 'said' }, el('summary', {}, "In the presenter's words"), el('blockquote', {}, s.presenterSaid)) : null),
    el('div', { class: 'side' },
      s.keyFacts.length ? [el('h3', {}, 'REMEMBER'), el('ul', {}, s.keyFacts.map(f => el('li', {}, f)))] : null,
      el('h3', {}, 'YOUR NOTES'), ta));
}

function drawProgress(v) {
  const total = v.questions.reduce((n, q) => n + q.parts.length, 0);
  const got = Object.values(store.get('marks:' + v.id, {})).filter(m => m === 'got').length;
  $('#progress').textContent = total ? `${got} / ${total} solved` : '';
}

function showLesson(v) {
  current = v;
  let mode = store.get('mode', 'all');
  const body = el('div');
  const draw = () => {
    body.replaceChildren();
    const marks = store.get('marks:' + v.id, {});
    const items = [
      ...v.sections.map((s, i) => ({ t: s.start, kind: 'sec', s, i })),
      ...v.questions.map((q, i) => ({ t: q.start + 0.5, kind: 'q', q, n: i + 1 })),
    ].sort((a, b) => a.t - b.t);
    for (const it of items) {
      if (it.kind === 'sec' && mode !== 'questions' && mode !== 'redo') body.append(sectionBlock(v, it.s, it.i));
      if (it.kind === 'q' && mode !== 'lesson') {
        if (mode === 'redo' && !it.q.parts.some((p, i) => marks[`${it.q.id}.${i}`] === 'miss')) continue;
        body.append(questionBlock(v, it.q, it.n));
      }
    }
    if (mode === 'redo' && !body.children.length) body.append(el('p', { class: 'sub' }, 'Nothing to redo. Mark a question "Missed it" and it lands here.'));
  };
  const toolMsg = el('span', { class: 'note' });
  const picBtn = el('button', { class: 'small' }, Object.keys(pics).length ? 'Refresh screenshots' : 'Get screenshots');
  picBtn.onclick = async () => {
    picBtn.disabled = true; toolMsg.className = 'note'; toolMsg.textContent = 'Getting screenshots...';
    const n = await fetchPictures(v, (a, b) => { toolMsg.textContent = `Screenshots ${a} of ${b}...`; });
    picBtn.disabled = false;
    if (!n) { toolMsg.className = 'note err'; toolMsg.textContent = "The picture server isn't reachable right now. Try again later."; return; }
    pics = await picsGet(v.id); toolMsg.textContent = ''; picBtn.textContent = 'Refresh screenshots'; draw();
  };
  const saveBtn = el('button', { class: 'small', onclick: () => {
    const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify({ ...v, frames: pics })], { type: 'application/json' })),
      download: (v.title.replace(/[^\w ]+/g, '').trim().slice(0, 60) || v.id) + '.lesson.json' });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } }, 'Save as a file to share');
  const tools = el('div', { class: 'tools' }, picBtn, saveBtn, toolMsg);
  const modes = el('div', { class: 'modes' });
  const drawModes = () => modes.replaceChildren(...[['all', 'Everything'], ['lesson', 'Lesson only'], ['questions', 'Questions only'], ['redo', `To redo (${Object.values(store.get('marks:' + v.id, {})).filter(m => m === 'miss').length})`]]
    .map(([m, label]) => el('button', { class: m === mode ? 'on' : '', onclick: () => { mode = m; store.set('mode', m); drawModes(); draw(); } }, label)));
  onMark = drawModes;
  if (mode === 'redo') mode = 'all';
  drawModes(); draw(); drawProgress(v);
  $('#app').replaceChildren(
    el('h1', {}, v.title),
    el('p', { class: 'sub' }, [v.channel, v.duration ? stamp(v.duration) : ''].filter(Boolean).join(' · '), (v.channel || v.duration) ? ' · ' : '',
      el('a', { href: v.url, target: '_blank', rel: 'noopener' }, 'original video')),
    tools, modes, body);
  // pick up where you left off
  const y = store.get('scroll:' + v.id, 0);
  requestAnimationFrame(() => window.scrollTo(0, y));
}

let scrollTimer;
addEventListener('scroll', () => {
  if (!current) return;
  clearTimeout(scrollTimer);
  const id = current.id;
  scrollTimer = setTimeout(() => { if (current && current.id === id) store.set('scroll:' + id, Math.round(scrollY)); }, 300);
}, { passive: true });

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return showHome(false);
  const v = store.get('v:' + id, null);
  if (v) return picsGet(id).then(p => { pics = p; showLesson(v); });
  current = null;
  $('#app').replaceChildren(el('div', { class: 'narrow' }, el('h1', {}, "That lesson isn't on this device."),
    el('p', { class: 'sub' }, 'Lessons are saved per device. ', el('a', { href: '#' }, 'Build it here'))));
}
addEventListener('hashchange', route);
store.set('queue', queue().map(x => x.state === 'work' ? { ...x, state: 'wait', note: '' } : x));
route();
runQueue();

// ---------- full screen screenshots
const viewer = el('div', { id: 'viewer', class: 'hide', role: 'dialog', 'aria-label': 'Screenshot', tabindex: '-1' });
const viewerImg = el('img', { alt: '' });
const viewerHelp = el('div', { class: 'vhelp' }, 'Tap the picture to zoom. Pinch or scroll to move around.');
const closeViewer = () => { viewer.classList.add('hide'); viewer.classList.remove('zoom'); document.body.style.overflow = ''; };
viewer.append(el('button', { class: 'small vclose', onclick: closeViewer }, 'Close'), viewerImg, viewerHelp);
document.body.append(viewer);
viewerImg.onclick = e => {
  e.stopPropagation();
  const r = viewerImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const zoomed = viewer.classList.toggle('zoom');
  if (zoomed) requestAnimationFrame(() => viewer.scrollTo(viewerImg.offsetWidth * fx - innerWidth / 2, viewerImg.offsetHeight * fy - innerHeight / 2));
};
viewer.onclick = closeViewer;
addEventListener('keydown', e => { if (e.key === 'Escape' && !viewer.classList.contains('hide')) closeViewer(); });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.tagName !== 'IMG' || t === viewerImg || !t.closest('#app')) return;
  viewerImg.src = t.src; viewerImg.alt = t.alt;
  viewer.classList.remove('hide', 'zoom'); document.body.style.overflow = 'hidden'; viewer.scrollTo(0, 0); viewer.focus();
});

// ---------- Ask AI
let chat = [];
const msgs = $('#msgs');
const say = (text, cls) => { const m = el('p', { class: 'msg ' + cls }, text); msgs.append(m); msgs.scrollTop = msgs.scrollHeight; return m; };
$('#aiBtn').onclick = () => { $('#ai').classList.remove('hide'); $('#ask').focus(); };
$('#aiClose').onclick = () => $('#ai').classList.add('hide');
$('#ask').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#askForm').requestSubmit(); } });
function context() {
  if (!current) return 'No lesson is open.';
  const v = current;
  return `Lesson: "${v.title}".\n` + v.sections.map(s => `${stamp(s.start)} ${s.title}: ${s.explain.join(' ')}`).join('\n') +
    '\nQuestions:\n' + v.questions.map((q, i) => `Q${i + 1} ${q.question} ` + q.parts.map(p => `(${p.label}) ${p.prompt} Answer: ${p.answer}`).join(' ')).join('\n');
}
$('#askForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('#ask').value.trim();
  if (!text) return;
  $('#ask').value = '';
  say(text, 'me');
  chat.push({ role: 'user', parts: [{ text }] });
  const wait = say('Thinking...', '');
  try {
    const out = await gemini({
      systemInstruction: { parts: [{ text: 'You are a patient tutor for a first-time learner. Short, plain answers. Plain text maths, no LaTeX, no markdown. For practice questions give a hint first, and the full solution only if asked. Lesson notes:\n' + context() }] },
      contents: chat,
    });
    wait.textContent = out;
    chat.push({ role: 'model', parts: [{ text: out }] });
  } catch (err) {
    chat.pop();
    wait.className = 'msg err';
    wait.textContent = "Couldn't reach the AI: " + err.message;
  }
  msgs.scrollTop = msgs.scrollHeight;
};
</script>
