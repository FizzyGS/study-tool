name: probe
on:
  workflow_dispatch:
    inputs:
      id: { description: 'YouTube video id', required: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: tools
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          yt-dlp --version; ffmpeg -version | head -1
      - name: try
        env:
          ID: ${{ inputs.id }}
        run: |
          case "$ID" in *[!A-Za-z0-9_-]*) exit 1;; esac
          try() { echo "== $1"; URL=$(yt-dlp --no-warnings --no-playlist $2 -g -f "$3" "https://www.youtube.com/watch?v=$ID" 2>&1 | head -1); echo "${URL:0:90}"; case "$URL" in http*) ffmpeg -loglevel error -y -ss 60 -i "$URL" -frames:v 1 "$1.jpg" && ls -l "$1.jpg";; esac; true; }
          try hd-hls "--extractor-args youtube:player_client=default" "bv*[protocol^=m3u8][height<=1080]/b[protocol^=m3u8][height<=1080]"
          try plain "" "bv*[height<=1080]/b"
          try tv "--extractor-args youtube:player_client=tv" "bv*[height<=1080]/b"
          try android_vr "--extractor-args youtube:player_client=android_vr" "bv*[height<=1080]/b"
          try web_safari "--extractor-args youtube:player_client=web_safari" "bv*[height<=1080]/b"
          echo "== playlist"; yt-dlp --no-warnings --flat-playlist --playlist-end 3 --print '%(id)s %(title)s' "https://www.youtube.com/playlist?list=PLFWt_XkIlKgbRtzdPGNcZ1DQFXrfvDRe3" 2>&1 | head -4; true
          echo "== storyboard"; yt-dlp --no-warnings --no-playlist --print '%(format_id)s %(width)sx%(height)s' -f 'sb0' "https://www.youtube.com/watch?v=$ID" 2>&1 | head -2; true
